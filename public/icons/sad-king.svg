  <path class="king" transform="translate(0 14)" d="M322 430

    Q328 419 340 419 H460

    Q472 419 478 430

    L505 470

    Q516 487 511 506

    Q506 526 480 531

    Q400 547 320 531

    Q294 526 289 506

    Q284 487 295 470Z"/>

  <path class="highlight" transform="translate(0 14)" d="M321 433 Q329 423 341 423 H459 Q471 423 479 433 L495 457 Q400 481 305 457Z"/>

  <path fill="#B3A4F1" transform="translate(0 14)" d="M291 493 Q400 529 509 493 Q518 514 497 526 Q400 551 303 526 Q282 514 291 493Z"/>

  </g>
</svg>
