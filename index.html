<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pick the theme before React loads, so the first paint has the right colors.
      // Reads the same keys as src/store/settings-store.ts and src/store/theme-lock.ts.
      (function () {
        try {
          var lock = localStorage.getItem('chessmate:theme-lock');
          var saved = JSON.parse(localStorage.getItem('chessmate:settings') || 'null');
          var setting = saved && saved.state ? saved.state.theme : 'system';
          var theme =
            lock === 'light' || lock === 'dark'
              ? lock
              : setting === 'light' || setting === 'dark'
                ? setting
                : window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#FFFDF8' : '#061824');
        } catch (e) {
          // Keep the dark default if storage is unavailable.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#061824" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChessMate" />
    <meta
      name="description"
      content="ChessMate: play chess against a cheeky frog, offline. Think. Move. Improve."
    />
    <title>ChessMate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
